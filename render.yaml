# Render Blueprint for the Control API. Secrets are set in the Render dashboard (sync: false),
# never committed.
services:
  - type: web
    name: portfolio-control-api
    runtime: python
    rootDir: control_api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: OWNER_EMAILS
        sync: false   # JSON list, e.g. ["you@example.com"]
      - key: VISITOR_HASH_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false   # JSON list of the portfolio + dashboard origins
