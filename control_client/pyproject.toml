[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "control-client"
version = "0.1.0"
description = "Lets a portfolio project obey the owner dashboard (model, budget, on/off) without redeploys"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
llm = ["litellm>=1.50"]
